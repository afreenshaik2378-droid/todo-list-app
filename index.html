<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">STUDENT PLANNER</p>
      <h1>My To-Do List</h1>
      <p class="subtitle">Small steps make big progress.</p>
    </header>

    <form id="taskForm" class="input-area">
      <input id="taskInput" type="text" placeholder="What do you need to do?" maxlength="160" autocomplete="off" required>
      <button type="submit">Add task</button>
    </form>

    <section class="task-summary" aria-live="polite">
      <span id="taskCount">0 tasks left</span>
      <button id="clearCompleted" class="text-button" type="button">Clear completed</button>
    </section>

    <ul id="taskList" aria-label="Your tasks"></ul>
    <p id="emptyMessage" class="empty-message">No tasks yet. Add your first task above!</p>
    <footer>Tasks are saved in this browser on your device.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
